<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portafolio</title>
  <meta name="description" content="" />
  <meta name="theme-color" content="#050507" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050507'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23a78bfa' stroke-width='2'/%3E%3C/svg%3E" />
  <script>
  // Resolve motion before first paint: visitor choice (?motion=full|reduced or the nav toggle) wins over the OS setting.
  (function () {
    var d = document.documentElement, m = "";
    d.classList.add("js");
    try {
      var q = new URLSearchParams(location.search).get("motion");
      if (q === "full" || q === "reduced") localStorage.setItem("portfolio-motion", q);
      m = localStorage.getItem("portfolio-motion") || "";
    } catch (e) {}
    var os = matchMedia("(prefers-reduced-motion: reduce)").matches;
    d.dataset.motion = m === "full" || m === "reduced" ? m : os ? "reduced" : "full";
    d.dataset.motionSource = m === "full" || m === "reduced" ? "user" : "system";
  })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <canvas id="fluid" aria-hidden="true"></canvas>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span></span></div>

  <header id="nav" class="nav"></header>
  <main id="main"></main>

  <div id="preloader" class="pre" role="presentation"></div>

  <noscript><style>[data-reveal]{opacity:1!important;transform:none!important}#preloader{display:none}</style></noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
